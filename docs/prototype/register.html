<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Crear cuenta | VialApp</title>

	<link rel="stylesheet" href="css/styles.css">
</head>

<body class="registration-page">

	<header class="registration-header">
		<a href="index.html" class="brand">	
			<span class="brand-mark">V</span>
			<span>VialApp</span>
		</a>
	</header>

	<main class="registration-main">

		<section
			class="registration-card"
			aria-labelledby="registration-heading"
		>
			<p class="eyebrow">Crear cuenta</p>

			<h1 id="registration-heading">
				Regístrate en VialApp
			</h1>

			<p class="registration-description">
				Los campos marcados como obligatorios deben completarse.
			</p>

			<form
				class="registration-form"
				action="#"
				method="post"
			>

				<div class="form-field">
					<label for="name">
						Nombre
						<span>(obligatorio)</span>
					</label>

					<input
						type="text"
						id="name"
						name="name"
						autocomplete="name"
						required
					>
				</div>

				<div class="form-field">
					<label for="email">
						Correo electrónico
						<span>(obligatorio)</span>
					</label>

					<input
						type="email"
						id="email"
						name="email"
						autocomplete="email"
						required
					>
				</div>

				<div class="form-field">
					<label for="password">
						Contraseña
						<span>(obligatorio)</span>
					</label>

					<input
						type="password"
						id="password"
						name="password"
						autocomplete="new-password"
						required
					>
				</div>

				<button
					class="button button-primary registration-button"
					type="submit"
				>
					Registrarse
				</button>

			</form>
		</section>

	</main>

	<footer class="registration-footer">
		<p>VialApp</p>
	</footer>

</body>
</html>
