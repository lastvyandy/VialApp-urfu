services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vialapp_mvp_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./vialapp_mvp.db
      - SECRET_KEY=mvp-secret-key-urfu-2026
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vialapp_mvp_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy